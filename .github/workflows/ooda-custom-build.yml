name: OODA Custom Build Check

on:
  push:
    branches:
      - ooda/v1.22.1-custom
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OODA Files image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: ooda-files:1.22.1-ooda.test
          cache-from: type=gha
          cache-to: type=gha,mode=max
